<style>
:root{
  --bg:#0b0f14; --surface:#121824; --surface2:#1a2230; --text:#e7edf5; --muted:#8ea0b5;
  --accent:#3ddc97; --accent2:#4f8dfd; --border:#223042; --warn:#f5a524; color-scheme: dark;
}
:root[data-theme="light"]{ --bg:#f5f7fa; --surface:#ffffff; --surface2:#eef2f7; --text:#121824; --muted:#51607a; --accent:#0e9f6e; --accent2:#2563eb; --border:#dbe3ee; --warn:#b45309; color-scheme: light;}
:root[data-theme="dark"]{ --bg:#0b0f14; --surface:#121824; --surface2:#1a2230; --text:#e7edf5; --muted:#8ea0b5; --accent:#3ddc97; --accent2:#4f8dfd; --border:#223042; --warn:#f5a524; color-scheme: dark;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem;cursor:pointer}
.brand span.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--muted);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.95rem;font-family:inherit}
nav button.active{color:var(--text);background:var(--surface2);border-color:var(--border)}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.lang-toggle button{border:none;background:var(--surface2);color:var(--muted);padding:7px 12px;cursor:pointer;font-family:inherit}
.lang-toggle button.active{background:var(--accent2);color:#fff}
main{max-width:980px;margin:0 auto;padding:32px 20px 60px}
section{display:none}
section.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:2rem;margin:0 0 8px}
.lead{color:var(--muted);font-size:1.05rem;max-width:62ch;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:default}
.card.clickable{cursor:pointer;transition:border-color .15s}
.card.clickable:hover{border-color:var(--accent2)}
.card h3{margin:0 0 6px;font-size:1.05rem;color:var(--accent)}
.card p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.5}
.badge{display:inline-block;background:var(--surface2);color:var(--accent2);font-size:.75rem;padding:3px 9px;border-radius:999px;margin-bottom:10px;border:1px solid var(--border)}
.cta{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:inherit;font-size:.95rem}
.btn.primary{background:var(--accent2);color:#fff;border-color:transparent}
.notice{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--muted);font-size:.88rem;margin:22px 0;line-height:1.6}
.notice.warn{border-color:var(--warn);color:var(--warn)}
.back{background:none;border:none;color:var(--accent2);cursor:pointer;font-size:.9rem;padding:0;margin-bottom:16px;font-family:inherit}
.tool-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phase{display:inline-block;background:var(--surface2);border:1px solid var(--border);color:var(--accent);font-size:.78rem;padding:4px 10px;border-radius:999px}
ul.feat{margin:10px 0 0;padding-inline-start:20px;color:var(--muted);line-height:1.8}
.section-h{margin:26px 0 8px;font-size:1.1rem}
.link-ext{color:var(--accent2);text-decoration:none;font-size:.9rem}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.meta .chip{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:.88rem;line-height:1.5;color:var(--muted);flex:1 1 240px}
.meta .chip b{display:block;color:var(--text);margin-bottom:2px;font-size:.82rem}
ol.topics{margin:10px 0 0;padding-inline-start:22px;color:var(--muted);line-height:1.9}
.res{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:18px;margin-top:10px}
.res h3{margin:0 0 6px;font-size:1.05rem;color:var(--accent)}
.res p{margin:0 0 14px;color:var(--muted);line-height:1.7;font-size:.93rem}
.res .url{display:block;direction:ltr;text-align:start;color:var(--muted);font-size:.8rem;margin-top:10px;word-break:break-all}
.res.alt{border-color:var(--border)}
.res.alt h3{color:var(--accent2)}
a.btn{text-decoration:none;display:inline-block}
.level{display:inline-block;background:var(--surface2);border:1px solid var(--border);color:var(--accent2);font-size:.78rem;padding:4px 10px;border-radius:999px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px;border-top:1px solid var(--border)}

.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.header-actions .btn{padding:7px 11px;font-size:.85rem}
.search-wrap{margin:18px 0 8px}
.search-input{width:100%;padding:12px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;outline:none}
.search-input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 18%,transparent)}
.empty-state{padding:18px;border:1px dashed var(--border);border-radius:10px;color:var(--muted);text-align:center;margin-top:12px}
#quizModal{display:none;position:fixed;inset:0;z-index:20;background:#0009;align-items:center;justify-content:center;padding:16px}
#quizModal.open{display:flex}
.quiz-panel{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 20px 70px #0006}
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.quiz-progress{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:14px 0 20px}
.quiz-progress span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.quiz-question{font-size:1.1rem;line-height:1.7;margin:12px 0}
.quiz-options{display:grid;gap:9px}
.quiz-option{width:100%;text-align:start;padding:12px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--text);font:inherit;cursor:pointer}
.quiz-option:hover{border-color:var(--accent2)}
.quiz-option:disabled{cursor:default;opacity:.85}
.quiz-option.correct{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,var(--surface2))}
.quiz-option.wrong{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,var(--surface2))}
.quiz-feedback{margin-top:12px;color:var(--muted);line-height:1.6;min-height:24px}
.quiz-result{text-align:center;padding:16px 0}
.quiz-result strong{display:block;font-size:2rem;color:var(--accent);margin:8px}
@media(max-width:650px){header{padding:12px}nav{order:3;width:100%;overflow-x:auto}nav button{white-space:nowrap;padding:8px 10px}.header-actions{margin-inline-start:auto}main{padding:24px 14px 48px}h1{font-size:1.6rem}}

#quizContent{max-height:70vh;overflow-y:auto;padding-right:4px} #quizContent .quiz-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(max-width:560px){#quizContent .quiz-options{grid-template-columns:1fr}} </style>
</head>
<body>
<header>
  <div class="brand" id="brandBtn"><span class="dot"></span><span id="brandText">CyberShield</span></div>
  <nav id="nav"></nav>
  <div class="header-actions">
    <button class="btn" id="themeToggle" type="button" aria-label="Toggle theme">☀️ / 🌙</button>
    <button class="btn" id="quizOpen" type="button">🧠 اختبر معلوماتك</button>
    <div class="lang-toggle">
      <button id="btnAr">AR</button>
      <button id="btnEn">EN</button>
    </div>
  </div>

</header>

<main>
  <section id="home"></section>
  <section id="courses"></section>
  <section id="tools"></section>
  <section id="about"></section>
  <section id="tool"></section>
  <section id="course"></section>
</main>
<footer id="footerText"></footer>

<div id="quizModal" role="dialog" aria-modal="true" aria-labelledby="quizTitle">
  <div class="quiz-panel">
    <div class="quiz-top">
      <h2 id="quizTitle">🧠 اختبر معلوماتك</h2>
      <button class="btn" id="quizClose" type="button" aria-label="Close quiz">✕</button>
    </div>
    <div id="quizContent"></div>
  </div>
</div>

<script src="./app.js" defer></script>
</body>
</html>
